name: DataIntelligenceSuite v2.0 CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/DataIntelligenceSuite/**'
      - '.github/workflows/dataintelligence-v2-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/DataIntelligenceSuite/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}/dataintelligence

jobs:
  test-common-library:
    name: Test Common Library v2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          cd services/DataIntelligenceSuite/data-intelligence-common
          pip install -e .[dev]
          
      - name: Run tests
        run: |
          cd services/DataIntelligenceSuite/data-intelligence-common
          pytest tests/ -v --cov=src --cov-report=xml
          
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./services/DataIntelligenceSuite/data-intelligence-common/coverage.xml
          flags: common-library

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test-common-library
    strategy:
      matrix:
        service:
          - data-platform-service
          - analytics-engine-service
          - ml-platform-service
          - data-governance-service
          - stream-processing-service-v2
          - orchestration-service
          - integration-hub-service
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install common library
        run: |
          cd services/DataIntelligenceSuite/data-intelligence-common
          pip install -e .
          
      - name: Install service dependencies
        run: |
          cd services/DataIntelligenceSuite/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          
      - name: Run unit tests
        run: |
          cd services/DataIntelligenceSuite/${{ matrix.service }}
          pytest tests/unit/ -v --cov=app --cov-report=xml || true
          
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./services/DataIntelligenceSuite/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-services
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd services/DataIntelligenceSuite
          pip install -e data-intelligence-common/
          pip install httpx pytest pytest-asyncio
          
      - name: Run integration tests
        run: |
          cd services/DataIntelligenceSuite
          pytest tests/integration/v2/ -v -m integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

  build-images:
    name: Build ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - data-platform-service
          - analytics-engine-service
          - ml-platform-service
          - data-governance-service
          - stream-processing-service-v2
          - orchestration-service
          - integration-hub-service
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=2.0.0,enable={{is_default_branch}}
            
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: services/DataIntelligenceSuite/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_VERSION=2.0.0

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Set up Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          
      - name: Update image tags
        run: |
          cd services/DataIntelligenceSuite
          for service in data-platform-service analytics-engine-service ml-platform-service data-governance-service stream-processing-service-v2 orchestration-service integration-hub-service; do
            kustomize edit set image $service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$service:develop
          done
          
      - name: Deploy to staging
        run: |
          kubectl apply -k services/DataIntelligenceSuite/k8s/overlays/staging
        env:
          KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Locust
        run: pip install locust
        
      - name: Run performance tests
        run: |
          cd services/DataIntelligenceSuite/tests/performance
          locust --headless --users 100 --spawn-rate 10 --run-time 5m --host ${{ secrets.STAGING_URL }}
          
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: services/DataIntelligenceSuite/tests/performance/results/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Deploy to production
        run: |
          kubectl apply -k services/DataIntelligenceSuite/k8s/overlays/production
        env:
          KUBECONFIG: ${{ secrets.PRODUCTION_KUBECONFIG }}
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment -n dataintelligence -l suite=dataintelligence
          
      - name: Run smoke tests
        run: |
          cd services/DataIntelligenceSuite/tests
          pytest smoke/ -v --host=${{ secrets.PRODUCTION_URL }}

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/DataIntelligenceSuite'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 