# Default values for compute-allocation-service

replicaCount: 3

image:
  repository: platformq/compute-allocation-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: compute-allocation.platformq.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: compute-allocation-tls
      hosts:
        - compute-allocation.platformq.io

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: SERVICE_NAME
    value: "compute-allocation-service"
  - name: SERVICE_HOST
    value: "0.0.0.0"
  - name: SERVICE_PORT
    value: "8000"
  - name: ENVIRONMENT
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  
  # Consul Configuration
  - name: CONSUL_HOST
    value: "consul.default.svc.cluster.local"
  - name: CONSUL_PORT
    value: "8500"
  - name: CONSUL_TOKEN
    valueFrom:
      secretKeyRef:
        name: consul-tokens
        key: compute-allocation-token
  
  # Vault Configuration
  - name: VAULT_ENABLED
    value: "true"
  - name: VAULT_ADDR
    value: "http://vault.default.svc.cluster.local:8200"
  - name: VAULT_TOKEN
    valueFrom:
      secretKeyRef:
        name: vault-tokens
        key: compute-allocation-token
  
  # Messaging
  - name: PULSAR_URL
    value: "pulsar://pulsar-proxy.default.svc.cluster.local:6650"
  
  # Monitoring
  - name: PROMETHEUS_URL
    value: "http://prometheus.monitoring.svc.cluster.local:9090"

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - compute-allocation-service
        topologyKey: kubernetes.io/hostname

# NetworkPolicy
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: default
      ports:
      - port: 8000
        protocol: TCP
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - port: 8000
        protocol: TCP
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            name: default
      ports:
      - port: 8500  # Consul
        protocol: TCP
      - port: 8200  # Vault
        protocol: TCP
      - port: 6650  # Pulsar
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - port: 9090  # Prometheus
        protocol: TCP
    - ports:
      - port: 53    # DNS
        protocol: UDP
      - port: 443   # HTTPS for external APIs
        protocol: TCP

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics 