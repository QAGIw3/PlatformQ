{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "provisioning-service.fullname" . }}
  labels:
    {{- include "provisioning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "provisioning-service.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "provisioning-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }} 