version: '3.8'

services:
  data-catalog-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-catalog-hub
    environment:
      # Application settings
      - ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      
      # Service URLs
      - ATLAS_URL=http://atlas:21000
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - IGNITE_HOST=ignite
      - IGNITE_PORT=10800
      - PULSAR_URL=pulsar://pulsar:6650
      
      # Security (use secrets in production)
      - ATLAS_USERNAME=admin
      - ATLAS_PASSWORD=admin
      
      # Features
      - ENABLE_CONSUL=false
      - ENABLE_VAULT=false
      
    ports:
      - "8000:8000"
    depends_on:
      - atlas
      - elasticsearch
      - ignite
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro  # Mount code for development
    networks:
      - catalog-network

  # Apache Atlas
  atlas:
    image: apache/atlas:2.3.0
    container_name: atlas
    environment:
      - ATLAS_SERVER_HEAP=-Xms2g -Xmx2g
    ports:
      - "21000:21000"
    volumes:
      - atlas-data:/opt/atlas/data
    networks:
      - catalog-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - catalog-network

  # Apache Ignite
  ignite:
    image: apacheignite/ignite:2.15.0
    container_name: ignite
    environment:
      - IGNITE_QUIET=false
      - JVM_OPTS=-Xms1g -Xmx1g
    ports:
      - "10800:10800"
      - "47100:47100"
      - "47500:47500"
    volumes:
      - ignite-data:/persistence
      - ./infra/ignite:/opt/ignite/config
    command: /opt/ignite/bin/ignite.sh /opt/ignite/config/ignite-config.xml
    networks:
      - catalog-network

  # MinIO (for object storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - catalog-network

volumes:
  atlas-data:
  es-data:
  ignite-data:
  minio-data:

networks:
  catalog-network:
    driver: bridge 