# Install the Crossplane OpenStack Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-openstack
spec:
  package: xpkg.upbound.io/upbound/provider-openstack:v0.1.0  # Use appropriate version
---
# Provider configuration with OpenStack credentials
apiVersion: openstack.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: openstack-provider
spec:
  credentials:
    source: Secret
    secretRef:
      name: openstack-credentials
      namespace: crossplane-system
      key: credentials
---
# OpenStack credentials secret
# This should be created securely with proper RBAC
apiVersion: v1
kind: Secret
metadata:
  name: openstack-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "auth_url": "${OS_AUTH_URL}",
      "application_credential_id": "${OS_APPLICATION_CREDENTIAL_ID}",
      "application_credential_secret": "${OS_APPLICATION_CREDENTIAL_SECRET}",
      "region_name": "${OS_REGION_NAME}",
      "interface": "public"
    }
---
