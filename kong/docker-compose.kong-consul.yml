version: '3.8'

services:
  # Kong Database
  kong-database:
    image: postgres:14-alpine
    container_name: kong-database
    networks:
      - consul
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Migrations
  kong-migrations:
    image: kong:3.5
    container_name: kong-migrations
    networks:
      - consul
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_DNS_RESOLVER: consul-server-1:8600
    command: kong migrations bootstrap

  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: kong
    networks:
      - consul
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      consul-server-1:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      # Consul DNS resolution
      KONG_DNS_RESOLVER: consul-server-1:8600
      KONG_DNS_ORDER: LAST,A,SRV
      # Plugins
      KONG_PLUGINS: bundled,oidc,prometheus
      # Headers
      KONG_HEADERS: off
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
    ports:
      - "8000:8000"   # Proxy port
      - "8443:8443"   # Proxy SSL port
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin SSL port
      - "8002:8002"   # Admin GUI
    volumes:
      - ./kong/plugins:/usr/local/share/lua/5.1/kong/plugins
      - ./kong/config:/kong/config
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong configuration sync service
  kong-config-sync:
    build:
      context: ./kong
      dockerfile: Dockerfile.config-sync
    container_name: kong-config-sync
    networks:
      - consul
    depends_on:
      kong:
        condition: service_healthy
      consul-server-1:
        condition: service_healthy
    environment:
      KONG_ADMIN_URL: http://kong:8001
      CONSUL_HTTP_ADDR: consul-server-1:8500
      SYNC_INTERVAL: 10
    volumes:
      - ./kong/scripts:/scripts

  # Konga (Kong Admin UI)
  konga:
    image: pantsel/konga:latest
    container_name: konga
    networks:
      - consul
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga
    ports:
      - "1337:1337"

networks:
  consul:
    external: true

volumes:
  kong_db_data: 