version: '3.8'
services:
  consul-server-1:
    image: consul:1.16
    container_name: consul-server-1
    restart: unless-stopped
    volumes:
    - ./consul/config/consul.hcl:/consul/config/consul.hcl:ro
    - consul-server-1-data:/consul/data
    networks:
    - consul
    environment:
    - CONSUL_BIND_INTERFACE=eth0
    - CONSUL_CLIENT_INTERFACE=eth0
    ports:
    - 8500:8500
    - 8600:8600/tcp
    - 8600:8600/udp
    command: agent -server -ui -node=consul-server-1 -bootstrap-expect=3 -config-file=/consul/config/consul.hcl
  consul-server-2:
    image: consul:1.16
    container_name: consul-server-2
    restart: unless-stopped
    volumes:
    - ./consul/config/consul.hcl:/consul/config/consul.hcl:ro
    - consul-server-2-data:/consul/data
    networks:
    - consul
    environment:
    - CONSUL_BIND_INTERFACE=eth0
    - CONSUL_CLIENT_INTERFACE=eth0
    command: agent -server -node=consul-server-2 -bootstrap-expect=3 -retry-join=consul-server-1
      -config-file=/consul/config/consul.hcl
  consul-server-3:
    image: consul:1.16
    container_name: consul-server-3
    restart: unless-stopped
    volumes:
    - ./consul/config/consul.hcl:/consul/config/consul.hcl:ro
    - consul-server-3-data:/consul/data
    networks:
    - consul
    environment:
    - CONSUL_BIND_INTERFACE=eth0
    - CONSUL_CLIENT_INTERFACE=eth0
    command: agent -server -node=consul-server-3 -bootstrap-expect=3 -retry-join=consul-server-1
      -config-file=/consul/config/consul.hcl
  vault:
    image: vault:1.14
    container_name: vault
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 8200:8200
    environment:
    - VAULT_DEV_ROOT_TOKEN_ID=root
    - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
    - IPC_LOCK
  ignite:
    image: apacheignite/ignite:2.15.0
    container_name: ignite
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 10800:10800
    - 11211:11211
    environment:
    - IGNITE_QUIET=false
    volumes:
    - ./infra/ignite:/opt/ignite/config:ro
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: pulsar
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 6650:6650
    - 8080:8080
    command: bin/pulsar standalone
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 9042:9042
    environment:
    - CASSANDRA_CLUSTER_NAME=platformq
    - CASSANDRA_DC=dc1
    - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: elasticsearch
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 9200:9200
    - 9300:9300
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 9000:9000
    - 9001:9001
    environment:
    - MINIO_ROOT_USER=minioadmin
    - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
  janusgraph:
    image: janusgraph/janusgraph:latest
    container_name: janusgraph
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 8182:8182
    environment:
    - janusgraph.storage.backend=cassandra
    - janusgraph.storage.hostname=cassandra
    - janusgraph.index.search.backend=elasticsearch
    - janusgraph.index.search.hostname=elasticsearch
    depends_on:
    - cassandra
    - elasticsearch
  opa:
    image: openpolicyagent/opa:latest
    container_name: opa
    restart: unless-stopped
    networks:
    - consul
    ports:
    - 8181:8181
    command: run --server --addr :8181
    volumes:
    - ./infra/docker-compose/opa:/policies:ro
  market-making-service:
    build:
      context: ./services/MarketServices/market-making-service
      dockerfile: Dockerfile
    container_name: market-making-service
    restart: unless-stopped
    networks:
    - consul
    environment:
    - CONSUL_HTTP_ADDR=consul-agent-market-making:8500
    - SERVICE_NAME=market-making-service
    - SERVICE_PORT=8000
    depends_on:
    - consul-agent-market-making
  consul-agent-market-making:
    image: consul:1.16
    container_name: consul-agent-market-making
    restart: unless-stopped
    volumes:
    - ./consul/config/consul-client.hcl:/consul/config/consul-client.hcl:ro
    - ./consul/services/market-making-service.json:/consul/config/market-making-service.json:ro
    networks:
    - consul
    environment:
    - CONSUL_BIND_INTERFACE=eth0
    - CONSUL_CLIENT_INTERFACE=eth0
    command: agent -node=market-making-node -config-file=/consul/config/consul-client.hcl -config-file=/consul/config/market-making-service.json
    depends_on:
    - consul-server-1
    - consul-server-2
    - consul-server-3
  market-making-sidecar:
    image: envoyproxy/envoy-alpine:v1.27.0
    container_name: market-making-sidecar
    restart: unless-stopped
    networks:
    - consul
    environment:
    - CONSUL_HTTP_ADDR=consul-agent-market-making:8500
    - SERVICE_NAME=market-making-service
    - SERVICE_PORT=8000
    command: sh -c "consul connect envoy -sidecar-for market-making-service -admin-bind 0.0.0.0:19001"
    depends_on:
    - consul-agent-market-making
    - market-making-service
