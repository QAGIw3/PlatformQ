version: '3.8'

services:
  # OPA - Open Policy Agent
  opa:
    image: openpolicyagent/opa:0.59.0-envoy
    container_name: opa
    command:
      - "run"
      - "--server"
      - "--config-file=/config/opa-config.yaml"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8282"
      - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
      - "--set=plugins.envoy_ext_authz_grpc.query=data.platformq.authz.allow"
      - "--set=decision_logs.console=true"
    ports:
      - "8181:8181"  # HTTP API
      - "9191:9191"  # gRPC API for Envoy
      - "8282:8282"  # Diagnostics
    volumes:
      - ./opa/opa-config.yaml:/config/opa-config.yaml
      - ./opa/policies:/policies
    networks:
      - platformq-network
    depends_on:
      - consul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Security Service
  security-service:
    build:
      context: ../../services/security-service
      dockerfile: Dockerfile
    image: platformq/security-service:latest
    container_name: security-service
    environment:
      - SERVICE_NAME=security-service
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - CONSUL_ADDR=http://consul:8500
      - OPA_ADDR=http://opa:8181
      - PULSAR_URL=pulsar://pulsar:6650
      - LOG_LEVEL=INFO
    ports:
      - "8020:8000"
    networks:
      - platformq-network
    depends_on:
      - vault
      - consul
      - opa
      - pulsar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kong DB Migration
  kong-migrations:
    image: kong:3.5
    container_name: kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
    command: kong migrations bootstrap
    networks:
      - platformq-network
    depends_on:
      - postgres
    restart: on-failure

  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_PLUGINS: bundled,oidc
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy SSL
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin SSL
      - "8002:8002"  # Admin GUI
    networks:
      - platformq-network
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./kong/plugins:/usr/local/share/lua/5.1/kong/plugins
      - ./kong/config:/kong/declarative
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Envoy Proxy (for service mesh)
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: envoy
    command: 
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--service-cluster"
      - "platformq"
      - "--service-node"
      - "envoy"
    ports:
      - "9901:9901"  # Admin
      - "10000:10000"  # Proxy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ./envoy/certs:/etc/envoy/certs
    networks:
      - platformq-network
    depends_on:
      - consul
      - opa

  # Bundle Server for OPA policies
  bundle-server:
    image: nginx:alpine
    container_name: bundle-server
    volumes:
      - ./opa/bundles:/usr/share/nginx/html/bundles
    ports:
      - "8080:80"
    networks:
      - platformq-network

  # Cert Manager (for automatic certificate management)
  cert-manager:
    build:
      context: ./cert-manager
      dockerfile: Dockerfile
    image: platformq/cert-manager:latest
    container_name: cert-manager
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - CONSUL_ADDR=http://consul:8500
    volumes:
      - ./certs:/certs
    networks:
      - platformq-network
    depends_on:
      - vault
      - consul

networks:
  platformq-network:
    external: true

volumes:
  vault-data:
    driver: local
  consul-data:
    driver: local
  kong-data:
    driver: local 