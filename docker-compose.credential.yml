version: '3.8'

services:
  # Core Credential Service
  core-credential-service:
    build:
      context: ./services/credential/core-credential-service
      dockerfile: Dockerfile
    container_name: core-credential-service
    environment:
      - CREDENTIAL_SERVICE_NAME=core-credential-service
      - CREDENTIAL_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres/credentials
      - CREDENTIAL_DID_SERVICE_URL=http://did-service:8051
      - CREDENTIAL_BLOCKCHAIN_CONNECTOR_URL=http://blockchain-connector-service:8086
      - CREDENTIAL_KEY_MANAGEMENT_URL=http://key-management-service:8088
      - CREDENTIAL_STORAGE_SERVICE_URL=http://storage-service:8084
      - CREDENTIAL_PULSAR_URL=pulsar://pulsar:6650
      - CREDENTIAL_IGNITE_HOST=ignite
      - CREDENTIAL_IGNITE_PORT=10800
      - CREDENTIAL_VAULT_ADDR=http://vault:8200
      - CREDENTIAL_VAULT_TOKEN=${VAULT_TOKEN}
      - CREDENTIAL_CONSUL_HOST=consul
      - CREDENTIAL_CONSUL_PORT=8500
    ports:
      - "8050:8050"
    depends_on:
      - postgres
      - ignite
      - consul
      - vault
    networks:
      - platformq-network

  # DID Service
  did-service:
    build:
      context: ./services/credential/did-service
      dockerfile: Dockerfile
    container_name: did-service
    environment:
      - DID_SERVICE_NAME=did-service
      - DID_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres/dids
      - DID_KEY_MANAGEMENT_URL=http://key-management-service:8088
      - DID_BLOCKCHAIN_CONNECTOR_URL=http://blockchain-connector-service:8086
      - DID_IGNITE_HOST=ignite
      - DID_IGNITE_PORT=10800
      - DID_VAULT_ADDR=http://vault:8200
      - DID_VAULT_TOKEN=${VAULT_TOKEN}
      - DID_CONSUL_HOST=consul
      - DID_CONSUL_PORT=8500
    ports:
      - "8051:8051"
    depends_on:
      - postgres
      - ignite
      - consul
      - vault
    networks:
      - platformq-network

  # ZKP Service
  zkp-service:
    build:
      context: ./services/credential/zkp-service
      dockerfile: Dockerfile
    container_name: zkp-service
    environment:
      - ZKP_SERVICE_NAME=zkp-service
      - ZKP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres/zkp
      - ZKP_KEY_MANAGEMENT_URL=http://key-management-service:8088
      - ZKP_CREDENTIAL_SERVICE_URL=http://core-credential-service:8050
      - ZKP_IGNITE_HOST=ignite
      - ZKP_IGNITE_PORT=10800
      - ZKP_ENABLE_COMPUTE_GRID=true
      - ZKP_VAULT_ADDR=http://vault:8200
      - ZKP_VAULT_TOKEN=${VAULT_TOKEN}
      - ZKP_CONSUL_HOST=consul
      - ZKP_CONSUL_PORT=8500
    ports:
      - "8052:8052"
    depends_on:
      - postgres
      - ignite
      - consul
      - vault
    networks:
      - platformq-network

  # SBT Service
  sbt-service:
    build:
      context: ./services/credential/sbt-service
      dockerfile: Dockerfile
    container_name: sbt-service
    environment:
      - SBT_SERVICE_NAME=sbt-service
      - SBT_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres/sbt
      - SBT_BLOCKCHAIN_CONNECTOR_URL=http://blockchain-connector-service:8086
      - SBT_CREDENTIAL_SERVICE_URL=http://core-credential-service:8050
      - SBT_STORAGE_SERVICE_URL=http://storage-service:8084
      - SBT_PULSAR_URL=pulsar://pulsar:6650
      - SBT_IGNITE_HOST=ignite
      - SBT_IGNITE_PORT=10800
      - SBT_VAULT_ADDR=http://vault:8200
      - SBT_VAULT_TOKEN=${VAULT_TOKEN}
      - SBT_CONSUL_HOST=consul
      - SBT_CONSUL_PORT=8500
    ports:
      - "8053:8053"
    depends_on:
      - postgres
      - ignite
      - consul
      - vault
    networks:
      - platformq-network

  # Presentation Service
  presentation-service:
    build:
      context: ./services/credential/presentation-service
      dockerfile: Dockerfile
    container_name: presentation-service
    environment:
      - PRESENTATION_SERVICE_NAME=presentation-service
      - PRESENTATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres/presentations
      - PRESENTATION_CREDENTIAL_SERVICE_URL=http://core-credential-service:8050
      - PRESENTATION_ZKP_SERVICE_URL=http://zkp-service:8052
      - PRESENTATION_DID_SERVICE_URL=http://did-service:8051
      - PRESENTATION_IGNITE_HOST=ignite
      - PRESENTATION_IGNITE_PORT=10800
      - PRESENTATION_PULSAR_URL=pulsar://pulsar:6650
      - PRESENTATION_VAULT_ADDR=http://vault:8200
      - PRESENTATION_VAULT_TOKEN=${VAULT_TOKEN}
      - PRESENTATION_CONSUL_HOST=consul
      - PRESENTATION_CONSUL_PORT=8500
    ports:
      - "8054:8054"
    depends_on:
      - postgres
      - ignite
      - consul
      - vault
      - core-credential-service
      - did-service
      - zkp-service
    networks:
      - platformq-network

  # PostgreSQL for all credential services
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=credentials,dids,zkp,sbt,presentations
    volumes:
      - credential_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "5432:5432"
    networks:
      - platformq-network

  # Apache Ignite
  ignite:
    image: apacheignite/ignite:2.15.0
    environment:
      - IGNITE_WORK_DIR=/persistence
      - OPTION_LIBS=ignite-rest-http
    volumes:
      - ignite_data:/persistence
      - ./infra/ignite/credential-cache-config.xml:/opt/ignite/config/default-config.xml
    ports:
      - "10800:10800"  # Thin client port
      - "11211:11211"  # REST API port
      - "47100:47100"  # Discovery port
      - "47500:47500"  # Communication port
    networks:
      - platformq-network

  # Consul (if not already running)
  consul:
    image: consul:1.16
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      - platformq-network

  # Vault (if not already running)
  vault:
    image: vault:1.13
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-myroot}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - platformq-network

  # Consul Connect Sidecar Proxies (one for each service)
  core-credential-sidecar:
    image: envoyproxy/envoy:v1.27-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./consul/envoy/core-credential-service.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: "service:core-credential-service"
    depends_on:
      - core-credential-service

  did-sidecar:
    image: envoyproxy/envoy:v1.27-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./consul/envoy/did-service.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: "service:did-service"
    depends_on:
      - did-service

  zkp-sidecar:
    image: envoyproxy/envoy:v1.27-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./consul/envoy/zkp-service.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: "service:zkp-service"
    depends_on:
      - zkp-service

  sbt-sidecar:
    image: envoyproxy/envoy:v1.27-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./consul/envoy/sbt-service.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: "service:sbt-service"
    depends_on:
      - sbt-service

  presentation-sidecar:
    image: envoyproxy/envoy:v1.27-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./consul/envoy/presentation-service.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: "service:presentation-service"
    depends_on:
      - presentation-service

volumes:
  credential_postgres_data:
  ignite_data:
  consul_data:

networks:
  platformq-network:
    external: true 